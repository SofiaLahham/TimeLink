<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a1a">
<title>TimeLink</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TimeLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://js.hcaptcha.com/1/api.js?onload=onHcaptchaLoad&render=explicit" async defer></script>
<style>
  :root{
    --bg:#0d0a1a;
    --card:#181430;
    --card2:#211a3d;
    --border:#2d2552;
    --text:#f4f2fb;
    --muted:#9089ac;
    --accent:#8b5cf6;
    --accent2:#6366f1;
    --accent-grad:linear-gradient(135deg,var(--accent),var(--accent2));
    --accent-ink:#ffffff;
    --ok:#4ade80;
    --danger:#f87171;
    --radius:22px;
    --card-shadow:0 10px 30px -14px rgba(0,0,0,.55);
    --glow1:rgba(139,92,246,.35);
    --glow2:rgba(99,102,241,.28);
  }
  :root[data-theme="light"]{
    --bg:#f6f4fc;
    --card:#ffffff;
    --card2:#efeafa;
    --border:#e5defa;
    --text:#1c1730;
    --muted:#79709b;
    --accent:#7c3aed;
    --accent2:#6d28d9;
    --accent-ink:#ffffff;
    --ok:#16a34a;
    --danger:#dc2626;
    --card-shadow:0 10px 26px -16px rgba(76,29,149,.28);
    --glow1:rgba(139,92,246,.16);
    --glow2:rgba(99,102,241,.13);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
    letter-spacing:-.01em;
    overflow-x:hidden;
    position:relative;
  }
  body::before, body::after{
    content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  }
  body::before{width:420px;height:420px;top:-160px;left:-150px;background:radial-gradient(circle,var(--glow1),transparent 70%);}
  body::after{width:380px;height:380px;bottom:-140px;right:-130px;background:radial-gradient(circle,var(--glow2),transparent 70%);}
  svg.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;}

  #app{max-width:560px;margin:0 auto;padding:22px 20px 104px;position:relative;z-index:1;}
  header.top{display:flex;align-items:flex-start;justify-content:space-between;padding:2px 0 26px;}
  header.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.02em;color:var(--text);}
  header.top .sub{font-size:13px;color:var(--muted);margin-top:4px;font-weight:500;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
    background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex:0 0 auto;transition:color .15s,border-color .15s;box-shadow:var(--card-shadow);
  }
  .icon-btn:active{transform:scale(.95);}
  .icon-btn:hover{color:var(--text);border-color:var(--accent);}

  .days{display:flex;gap:10px;padding:2px 2px 24px;}
  .day-pill{
    flex:1;padding:9px 4px;border-radius:16px;border:1px solid var(--border);
    background:var(--card);color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;
    transition:background .15s,color .15s,border-color .15s;
  }
  .day-pill .d{letter-spacing:.03em;}
  .day-pill .num{font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  .day-pill .dot{width:5px;height:5px;border-radius:50%;background:var(--border);}
  .day-pill.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .day-pill.active .num{color:var(--accent-ink);}
  .day-pill.active .dot{background:var(--accent-ink);}
  .day-pill.today:not(.active){border-color:var(--accent);color:var(--accent);}
  .day-pill.today:not(.active) .num{color:var(--accent);}
  .day-pill:not(.active).has .dot{background:var(--accent);}

  .tipo-badge{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;
    padding:2px 7px;border-radius:999px;border:1px solid;margin-left:7px;vertical-align:middle;
  }

  .summary{display:flex;gap:10px;margin-bottom:26px;}
  .summary .chip{flex:1;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 10px;text-align:center;box-shadow:var(--card-shadow);}
  .summary .chip .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
  .summary .chip .val{font-size:13px;margin-top:6px;font-weight:600;line-height:1.4;color:var(--text);}

  .turno-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--card-shadow);}
  .turno-card.now{border-color:var(--accent);}
  .turno-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .turno-head-left{display:flex;align-items:center;gap:9px;}
  .turno-head .label{font-weight:700;font-size:14px;color:var(--text);font-variant-numeric:tabular-nums;}
  .turno-head .now-tag{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;}
  .bloco-tag{font-size:10.5px;font-weight:700;color:var(--accent);border:1px solid var(--accent);padding:2px 9px;border-radius:999px;letter-spacing:.03em;}
  .aula-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border);}
  .aula-row:first-of-type{border-top:none;padding-top:2px;}
  .aula-row.naovai{opacity:.55;}
  .avatar{
    width:36px;height:36px;border-radius:50%;flex:0 0 auto;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;
    box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--border);
  }
  .aula-info{flex:1;min-width:0;}
  .aula-info .nome{font-size:14px;font-weight:600;color:var(--text);}
  .aula-info .local{font-size:12.5px;color:var(--muted);margin-top:1px;}
  .presenca-switch{
    flex:0 0 auto;display:flex;gap:2px;background:var(--card2);border:1px solid var(--border);
    border-radius:999px;padding:3px;
  }
  .presenca-switch button{
    background:transparent;border:none;color:var(--muted);font-size:10.5px;font-weight:700;
    padding:6px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;
  }
  .presenca-switch button.sel{background:var(--accent);color:var(--accent-ink);}
  .presenca-switch button.off.sel{background:var(--danger);color:#fff;}
  .naovai-tag{
    flex:0 0 auto;font-size:10px;font-weight:700;color:var(--danger);border:1px solid var(--danger);
    background:transparent;padding:4px 9px;border-radius:999px;white-space:nowrap;opacity:.9;
  }

  .empty{text-align:center;color:var(--muted);padding:64px 20px;font-size:13.5px;line-height:1.6;}
  .empty svg{margin:0 auto 14px;opacity:.55;}

  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:28px 2px 10px;}
  .section-title:first-child{margin-top:0;}

  .list-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--card-shadow);}
  .list-item .grow{flex:1;min-width:0;}
  .list-item .t1{font-size:14px;font-weight:600;color:var(--text);}
  .list-item .t2{font-size:12.5px;color:var(--muted);margin-top:1px;}
  .list-item button.del{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex;flex:0 0 auto;}
  .list-item button.del:hover{color:var(--danger);}
  .swatch{width:32px;height:32px;border-radius:50%;flex:0 0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--border);}

  form.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px;box-shadow:var(--card-shadow);}
  .field{margin-bottom:14px;}
  .field:last-of-type{margin-bottom:0;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
  .field input, .field select{
    width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;
    color:var(--text);padding:11px 12px;font-size:14px;font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--accent);}
  .row2{display:flex;gap:10px;}
  .row2 > .field{flex:1;}
  .palette{display:flex;gap:9px;flex-wrap:wrap;}
  .palette .sw{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:0 0 0 1px var(--border);}
  .palette .sw.sel{border-color:var(--card);box-shadow:0 0 0 2px var(--accent);}
  .cor-custom-sw{
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(from 0deg,#f87171,#facc15,#4ade80,#22d3ee,#818cf8,#f472b6,#f87171);
  }
  .cor-custom-sw input[type="color"]{
    position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);
    border:none;padding:0;cursor:pointer;opacity:0;
  }

  button.primary{
    width:100%;background:var(--accent-grad);color:var(--accent-ink);
    border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;
    letter-spacing:-.01em;transition:opacity .15s;box-shadow:0 10px 22px -10px var(--glow1);
  }
  button.primary:active{opacity:.85;}
  button.secondary{
    width:100%;background:transparent;color:var(--text);border:1px solid var(--border);
    border-radius:14px;padding:12px;font-size:13.5px;font-weight:600;cursor:pointer;margin-top:10px;
  }
  button.secondary:first-child{margin-top:0;}
  .err{color:var(--danger);font-size:12.5px;margin-top:8px;}
  .status{position:fixed;top:14px;left:50%;transform:translateX(-50%);
    background:var(--text);color:var(--bg);max-width:86%;text-align:center;white-space:normal;line-height:1.4;
    font-size:12px;font-weight:600;padding:8px 16px;border-radius:16px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;}
  .status.show{opacity:1;}
  .lock-screen{padding:8px 4px 28px;text-align:left;}
  .lock-screen p{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0;}
  .top-edit-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
  .top-edit-bar .title{font-weight:700;font-size:19px;letter-spacing:-.02em;}

  /* Bottom nav */
  .bottomnav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;justify-content:center;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--bg) 65%,transparent);
  }
  .bottomnav .inner{
    display:flex;background:var(--card);border:1px solid var(--border);
    border-radius:22px;padding:6px;max-width:560px;width:100%;box-shadow:0 10px 30px -10px rgba(0,0,0,.45);
  }
  .bottomnav button{
    flex:1;background:transparent;border:none;color:var(--muted);padding:9px 4px;border-radius:16px;
    font-size:10.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;
    position:relative;letter-spacing:0;transition:transform .15s,background .15s,color .15s;
  }
  .bottomnav button.active{
    background:var(--accent-grad);color:var(--accent-ink);transform:translateY(-3px);
    box-shadow:0 8px 18px -6px var(--glow1);
  }
  .bottomnav button .badge{
    position:absolute;top:4px;right:calc(50% - 17px);background:var(--danger);color:#fff;
    border-radius:999px;font-size:9px;font-weight:700;min-width:15px;height:15px;line-height:15px;text-align:center;padding:0 3px;
  }

  .chave-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;text-align:center;margin-bottom:20px;box-shadow:var(--card-shadow);}
  .chave-box .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
  .chave-box .valor{font-size:30px;font-weight:700;letter-spacing:.12em;margin:10px 0;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums;}
  .req-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--card-shadow);}
  .req-item .grow{flex:1;min-width:0;}
  .req-actions{display:flex;gap:8px;}
  .btn-sm{border:none;border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .btn-sm.ok{background:var(--accent-grad);color:var(--accent-ink);}
  .btn-sm.no{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .link-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:13.5px;cursor:pointer;}
  .auth-toggle{text-align:center;margin-top:20px;font-size:13.5px;color:var(--muted);}
  .brand-hero{padding:18px 0 32px;}
  .brand-hero h1{font-size:28px;margin:0 0 8px;font-weight:700;letter-spacing:-.02em;color:var(--text);}
  .brand-hero .tagline{font-size:15px;font-weight:600;color:var(--accent);margin:0 0 10px;}
  .brand-hero p{color:var(--muted);font-size:14px;line-height:1.55;margin:0;max-width:400px;}

  /* Segmented control (tema) */
  .segmented{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px;}
  .segmented button{flex:1;background:transparent;border:none;color:var(--muted);padding:10px 4px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;}
  .segmented button.active{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15);}

  /* Emoji picker */
  .emoji-grid{display:flex;flex-wrap:wrap;gap:9px;}
  .emoji-grid .em{
    width:40px;height:40px;border-radius:14px;background:var(--bg);border:2px solid transparent;
    font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .emoji-grid .em.sel{border-color:var(--accent);}

  .profile-preview{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px;box-shadow:var(--card-shadow);}
  .profile-preview .av{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto;overflow:hidden;color:#fff;box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--border);}
  .profile-preview .av img, .avatar img, .swatch img{width:100%;height:100%;object-fit:cover;}
  .profile-preview .nm{font-weight:700;font-size:16px;letter-spacing:-.01em;}
  .profile-preview .em{font-size:12.5px;color:var(--muted);margin-top:2px;}

  /* Bloco chips (horários pré-definidos) */
  .bloco-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .bloco-chip{
    background:var(--bg);border:1px solid var(--border);border-radius:13px;padding:8px 11px;
    font-size:11.5px;font-weight:600;color:var(--text);cursor:pointer;text-align:left;line-height:1.3;
  }
  .bloco-chip .t{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:1px;}
  .bloco-chip.sel{background:var(--accent-grad);color:var(--accent-ink);border-color:transparent;}
  .bloco-chip.sel .t{color:rgba(255,255,255,.8);}

  /* Seleção de vários dias */
  .days-multi{display:flex;gap:7px;flex-wrap:wrap;}
  .days-multi button{
    padding:9px 14px;border-radius:13px;border:1px solid var(--border);background:var(--bg);
    color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .days-multi button.sel{background:var(--accent-grad);color:var(--accent-ink);border-color:transparent;}

  /* Onboarding */
  .ob-progress{display:flex;gap:5px;margin-bottom:26px;}
  .ob-progress .dot{flex:1;height:3px;border-radius:3px;background:var(--border);}
  .ob-progress .dot.on{background:var(--accent-grad);}
  .ob-day-title{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-.02em;}
  .ob-day-sub{color:var(--muted);font-size:13.5px;margin-bottom:22px;}
  .yn-row{display:flex;gap:10px;margin-bottom:22px;}
  .yn-row button{
    flex:1;padding:14px;border-radius:16px;border:1px solid var(--border);background:var(--card);
    color:var(--text);font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .yn-row button.sel{background:var(--accent-grad);color:var(--accent-ink);border-color:transparent;}
  .ob-nav{display:flex;gap:10px;margin-top:22px;}
  .ob-nav button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:14px;padding:12px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .ob-added-item{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:14px;padding:10px 12px;margin-top:8px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="status" class="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
